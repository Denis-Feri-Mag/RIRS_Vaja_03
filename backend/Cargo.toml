[workspace]
resolver = "2"
members = ["api", "service", "entity", "migration"]

[workspace.dependencies]
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-rust_decimal", "postgres-array"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-float", "serde-with-str"] }
thiserror = "2"
tracing = "0.1"
utoipa = { version = "5", features = ["uuid", "chrono", "decimal_float"] }
