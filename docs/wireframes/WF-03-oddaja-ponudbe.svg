 Helvetica, sans-serif" font-size="18" fill="#222" text-anchor="start" font-weight="bold">Pušča kuhinjska pipa</text><rect x="80" y="242" width="63.599999999999994" height="22" rx="11" fill="#e8e8e8" stroke="none" stroke-width="1"/><text x="111.8" y="257" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#333" text-anchor="middle">QUOTED</text><text x="80" y="290" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start">Kategorija: Vodovodna dela</text><text x="80" y="312" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start">Kraj: Maribor, 2000</text><text x="80" y="334" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start">Želeni termin: 19. 10. do 23. 10. 2026</text><text x="80" y="356" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start">Proračun: 40 do 100 €</text><line x1="80" y1="375" x2="560" y2="375" stroke="#bbb" stroke-width="1"/><text x="80" y="400" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#333" text-anchor="start">Pipa v kuhinji kaplja že teden dni, tudi ko je</text><text x="80" y="420" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#333" text-anchor="start">zaprta. Enoročna mešalna baterija, stara</text><text x="80" y="440" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#333" text-anchor="start">približno 10 let.</text><rect x="80" y="470" width="480" height="62" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/><text x="92" y="492" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#555" text-anchor="start">Naslov in telefon stranke boste videli,</text><text x="92" y="510" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#555" text-anchor="start">ko bo stranka sprejela vašo ponudbo.</text><text x="80" y="570" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#666" text-anchor="start">Do zdaj oddane ponudbe: 2</text><text x="640" y="215" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start" font-weight="bold">Cena z materialom (€) *</text><rect x="640" y="223" width="280" height="36" rx="4" fill="#fff" stroke="#999" stroke-width="1"/><text x="650" y="246.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#222" text-anchor="start">60</text><text x="640" y="277" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#888" text-anchor="start">Več kot 0 in največ 100.000 €</text><text x="940" y="215" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start" font-weight="bold">Ocena trajanja (ure) *</text><rect x="940" y="223" width="280" height="36" rx="4" fill="#fff" stroke="#999" stroke-width="1"/><text x="950" y="246.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#222" text-anchor="start">1,0</text><text x="940" y="277" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#888" text-anchor="start">Od 0,5 do 200 ur</text><text x="640" y="320" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start" font-weight="bold">Najzgodnejši začetek *</text><rect x="640" y="328" width="580" height="36" rx="4" fill="#fff" stroke="#999" stroke-width="1"/><text x="650" y="351.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#222" text-anchor="start">20. 10. 2026</text><text x="640" y="382" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#888" text-anchor="start">Ne sme biti v preteklosti</text><text x="640" y="425" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start" font-weight="bold">Sporočilo stranki</text><rect x="640" y="433" width="580" height="100" rx="4" fill="#fff" stroke="#999" stroke-width="1"/><text x="650" y="455" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#222" text-anchor="start">V ceno je vključena nova kartuša. Pridem lahko v torek popoldne.</text><text x="640" y="590" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#777" text-anchor="start">Ponudbo lahko uredite ali umaknete, dokler je stranka ne sprejme.</text><text x="640" y="610" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#777" text-anchor="start">Na eno povpraševanje lahko oddate samo eno ponudbo.</text><rect x="980" y="690" width="240" height="38" rx="6" fill="#444" stroke="#444" stroke-width="1"/><text x="1100.0" y="714.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Pošlji ponudbo</text><rect x="800" y="690" width="160" height="38" rx="6" fill="#fff" stroke="#444" stroke-width="1"/><text x="880.0" y="714.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#333" text-anchor="middle">Nazaj</text></g></svg>