ill="#222" text-anchor="start">Maribor</text><text x="330" y="555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start" font-weight="bold">Poštna številka *</text><rect x="330" y="563" width="250" height="36" rx="4" fill="#fff" stroke="#999" stroke-width="1"/><text x="340" y="586.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#222" text-anchor="start">2000</text><text x="640" y="215" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start" font-weight="bold">Želeni termin od</text><rect x="640" y="223" width="280" height="36" rx="4" fill="#fff" stroke="#999" stroke-width="1"/><text x="650" y="246.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#222" text-anchor="start">19. 10. 2026</text><text x="940" y="215" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start" font-weight="bold">do</text><rect x="940" y="223" width="280" height="36" rx="4" fill="#fff" stroke="#999" stroke-width="1"/><text x="950" y="246.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#222" text-anchor="start">23. 10. 2026</text><text x="640" y="295" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start" font-weight="bold">Proračun od (€)</text><rect x="640" y="303" width="280" height="36" rx="4" fill="#fff" stroke="#999" stroke-width="1"/><text x="650" y="326.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#222" text-anchor="start">40</text><text x="940" y="295" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start" font-weight="bold">Proračun do (€)</text><rect x="940" y="303" width="280" height="36" rx="4" fill="#fff" stroke="#999" stroke-width="1"/><text x="950" y="326.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#222" text-anchor="start">100</text><text x="640" y="375" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start" font-weight="bold">Ulica in hišna številka</text><rect x="640" y="383" width="580" height="36" rx="4" fill="#fff" stroke="#999" stroke-width="1"/><text x="650" y="406.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#222" text-anchor="start">Ulica Pariške komune 12</text><text x="640" y="437" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#888" text-anchor="start">Vidi jo samo mojster, čigar ponudbo sprejmete.</text><text x="640" y="480" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#444" text-anchor="start" font-weight="bold">Fotografije</text><rect x="640" y="490" width="580" height="70" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4"/><text x="930" y="530" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#999" text-anchor="middle">Na voljo v kasnejši različici</text><rect x="640" y="585" width="580" height="60" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/><text x="652" y="607" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#555" text-anchor="start">Povpraševanje bo odprto 14 dni (status OPEN).</text><text x="652" y="625" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#555" text-anchor="start">Če v tem času ne sprejmete nobene ponudbe, poteče.</text><rect x="940" y="690" width="280" height="38" rx="6" fill="#444" stroke="#444" stroke-width="1"/><text x="1080.0" y="714.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Objavi povpraševanje</text><rect x="640" y="690" width="160" height="38" rx="6" fill="#fff" stroke="#444" stroke-width="1"/><text x="720.0" y="714.0" font-family="De